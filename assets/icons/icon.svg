<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="3"/>

  <!-- Shield Boundary / Outer Layer -->
  <path d="M 64 22 
           C 84 22, 98 28, 98 42 
           C 98 74, 80 94, 64 106 
           C 48 94, 30 74, 30 42 
           C 30 28, 44 22, 64 22 Z" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="5" 
        stroke-linejoin="round"
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Friction Filtration Layers (3 Intentional Filter Plates) -->
  <!-- Top Plate (Relevance Layer) -->
  <path d="M 46 45 Q 64 40 82 45" 
        stroke="#2dd4bf" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        fill="none"/>

  <!-- Middle Plate (Quality / Focus Layer) -->
  <path d="M 42 58 Q 64 53 86 58" 
        stroke="url(#tealGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        fill="none"/>

  <!-- Bottom Plate (Risk / Clutter Shield Layer) -->
  <path d="M 48 71 Q 64 67 80 71" 
        stroke="#0d9488" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        fill="none"/>

  <!-- Intentional Core Focus Gem / Checkpoint -->
  <circle cx="64" cy="85" r="4.5" fill="#38bdf8" />
  <circle cx="64" cy="85" r="7" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="2 2" />
</svg>
